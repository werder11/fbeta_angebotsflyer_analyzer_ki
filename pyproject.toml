[project]
name = "flyercheck"
version = "0.1.0"
description = "AI-assisted consistency validation for retail promotional flyers"
authors = [
    { name = "werder11", email = "56775496+werder11@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.29.0",
    "jinja2>=3.1.6",
    "pillow>=12.3.0",
    "pydantic>=2.14.0",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "tenacity>=9.1.4",
    "typer>=0.27.3",
]

[project.scripts]
flyercheck = "flyercheck.cli:app"

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
extend-exclude = [".claude", ".docs", "data"]
